<h2 mat-dialog-title>Confirm Deletion</h2>
<mat-dialog-content>
  <p>Are you sure you want to delete this article?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <app-button label="Cancel" (click)="onCancel()" />
  <app-button
    color="warn"
    cdkFocusInitial
    icon="delete_forever"
    label="Delete"
    (click)="onConfirm()" />
</mat-dialog-actions>
